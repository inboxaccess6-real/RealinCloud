version: '3.8'

services:
  realinapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realinapi-dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=realin_db_dev;Username=postgres;Password=postgres
      - Jwt__SecretKey=dev_secret_key_minimum_32_characters_long_for_development_only
      - Jwt__Issuer=RealinApi
      - Jwt__Audience=RealinApp
      - Jwt__AccessTokenExpirationMinutes=1440
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - realin-network
    restart: unless-stopped
    volumes:
      # Hot reload support (optional)
      - ./:/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: realin-postgres-dev
    environment:
      - POSTGRES_DB=realin_db_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - realin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realin_db_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  realin-network:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
