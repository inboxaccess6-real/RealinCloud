name: CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'RealinAdmin/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'RealinAdmin/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RealinAdmin/RealEstate.sln

      - name: Build
        run: dotnet build RealinAdmin/RealEstate.sln -c Release --no-restore

      - name: Test
        run: dotnet test RealinAdmin/RealEstate.sln -c Release --no-build --verbosity normal
