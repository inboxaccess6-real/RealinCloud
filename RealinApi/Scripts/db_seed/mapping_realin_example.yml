Users:
  table: users
  columns:
    "OAuth Provider": oauth_provider
    "OAuth ID": oauth_id
    Email: email
    Name: name
    Picture: picture_url

Builders:
  table: builders
  columns:
    "Builder Name": name
    "Builder Email": email
    "Builder Phone": phone
    "Builder Website": website
  upsert_on:
    - email

Promoters:
  table: promoters
  columns:
    "Promoter Name": name
    "Promoter Email": email
    "Promoter Contact": contact
  upsert_on:
    - email
